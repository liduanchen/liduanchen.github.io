<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>端木子宸 | 灵感之源</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="intro-active">

    <!-- 开场：极简淡入 -->
    <div id="cinematic-intro">
        <div class="intro-inner">
            <h1 class="intro-name">端木子宸</h1>
            <p class="intro-sub">记录生活，发现美</p>
        </div>
        <button class="skip-btn" id="enter-site-btn">进入</button>
    </div>

    <!-- 主站内容 -->
    <div id="main-wrapper">
        <nav class="navbar">
            <div class="container nav-content">
                <a href="index.html" class="logo">端木子宸</a>
                <ul class="nav-links">
                    <li><a href="#top" class="active">首页</a></li>
                    <li><a href="#posts-section">随笔</a></li>
                    <li><a href="about.html">关于</a></li>
                </ul>
                <!-- 手势土星组件 -->
                <div class="saturn-wrapper">
                    <a href="tuxing.html" class="saturn-icon-btn" title="点击进入手势土星">
                        <svg width="44" height="44" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <!-- 1. 光环后半段 -->
                            <path d="M28 14C31 15.5 31 19 26 21.5C23.5 22.8 20 23 18 23" stroke="#a8a49a" stroke-width="3" stroke-linecap="round"/>

                            <!-- 2. 星球本体 -->
                            <circle cx="18" cy="18" r="9" fill="#E6D5AC" stroke="none"/>
                            <!-- 星球立体阴影 -->
                            <circle cx="18" cy="18" r="9" fill="url(#sphere-shadow)" style="mix-blend-mode: multiply; opacity: 0.15;"/>

                            <!-- 3. 光环前半段 -->
                            <path d="M8 22C5 20.5 5 17 10 14.5C13.5 12.8 19 12.5 24 13.5" stroke="#a8a49a" stroke-width="3" stroke-linecap="round"/>

                            <defs>
                                <radialGradient id="sphere-shadow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(16 16) rotate(45) scale(14)">
                                    <stop offset="0" stop-color="#fff" stop-opacity="0.5"/>
                                    <stop offset="1" stop-color="#000" stop-opacity="0.5"/>
                                </radialGradient>
                            </defs>
                        </svg>
                    </a>
                    <span class="saturn-text">来玩手势土星</span>
                </div>
                <button class="theme-btn" id="theme-toggle" title="切换主题">🌙</button>
            </div>
        </nav>

        <main class="container" id="top">
            <section class="hero">
                <h1 class="hero-title">Keep Hungry,<br>Keep Foolish.</h1>
                <p class="hero-subtitle">记录我的生活。</p>

                <div class="hero-stats">
                    <div class="stat-item">
                        <strong id="post-count">0</strong>
                        <span>文章</span>
                    </div>
                    <div class="stat-item">
                        <strong>2026</strong>
                        <span>Copyright</span>
                    </div>
                    <div class="stat-item">
                        <strong>∞</strong>
                        <span>Ideas</span>
                    </div>
                </div>
            </section>

            <section class="posts-section" id="posts-section">
                <div class="section-header">
                    <h2 class="section-title">Recent Posts</h2>
                    <span class="header-hint">View All ></span>
                </div>

                <div id="posts-container" class="posts-grid">
                    <div class="skeleton-loader"></div>
                    <div class="skeleton-loader"></div>
                    <div class="skeleton-loader"></div>
                </div>
            </section>

            <footer class="footer">
                &copy; 2026 端木子宸
            </footer>
        </main>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
