<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章阅读 | 端木子宸</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <!-- 代码高亮样式 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
</head>
<body class="page-article">

    <nav class="navbar">
        <div class="container nav-content">
            <a href="index.html" class="logo">端木子宸</a>
            <ul class="nav-links">
                <li><a href="index.html">首页</a></li>
                <li><a href="index.html#posts-section">随笔</a></li>
                <li><a href="about.html">关于</a></li>
                <li><button class="theme-btn" id="theme-toggle" title="切换主题">🌙</button></li>
            </ul>
        </div>
    </nav>

    <main class="container article-container">
        <!-- 动态渲染区域 -->
        <div id="loading" style="text-align: center; padding: 50px;">正在加载文章...</div>

        <div id="article-content" style="display: none;">
            <div class="article-breadcrumb">
                <a href="index.html">首页</a> / <span id="art-category">...</span>
            </div>

            <header class="article-header">
                <h1 class="article-title" id="art-title">文章标题</h1>
                <div class="article-meta" id="art-meta">
                    发布信息
                </div>
            </header>

            <div class="article-content markdown-body" id="art-body">
                <!-- 内容将通过 JS 插入 -->
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 端木子宸</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="js/script.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 1. 获取 URL 中的 ID (例如 ?id=post1)
            const params = new URLSearchParams(window.location.search);
            const postId = params.get('id');

            if (!postId) {
                window.location.href = 'index.html'; // 如果没有ID，回首页
                return;
            }

            // 2. 先加载 JSON 配置，找到对应的文件名
            fetch('posts.json')
                .then(res => res.json())
                .then(posts => {
                    const post = posts.find(p => p.id === postId);

                    if (post) {
                        // 渲染标题和元数据
                        document.getElementById('art-category').innerText = post.category;
                        document.getElementById('art-title').innerText = post.title;
                        document.getElementById('art-meta').innerText = `发布于 ${post.date}`;
                        document.title = `${post.title} | 端木子宸`;

                        // 3. 关键：根据 filename 加载真正的 Markdown 文件（统一从 posts/ 目录取）
                        const encodedPath = 'posts/' + encodeURIComponent(post.filename);
                        const rawPath = 'posts/' + post.filename;
                        // 优先尝试编码后的路径，失败则回退原始路径，避免中文/空格路径在某些本地服务器下 404
                        return fetch(encodedPath).then(r => r.ok ? r : fetch(rawPath));
                    } else {
                        throw new Error('Post not found in JSON');
                    }
                })
                .then(res => {
                    if (!res.ok) throw new Error('Markdown file not found');
                    return res.text();
                })
                .then(markdown => {
                    // 4. 将 Markdown 转换为 HTML
                    document.getElementById('art-body').innerHTML = marked.parse(markdown);

                    // 显示内容区域，隐藏加载提示
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('article-content').style.display = 'block';

                    // 代码高亮
                    hljs.highlightAll();
                })
                .catch(err => {
                    console.error(err);
                    document.getElementById('loading').innerHTML = `
                        <h1>404</h1>
                        <p>文章加载失败：${err.message}</p>
                        <a href="index.html">返回首页</a>
                    `;
                });
        });
    </script>
</body>
</html>
